<!DOCTYPE html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lichess Desktop</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="settings.js"></script>
</head>
<body>
<div class="window">
  <header class="window-header">
    <div class="tabs" role="tablist" aria-label="Lichess Desktop">
      <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true" data-i18n="desktop.settings"></button>
      <button type="button" role="tab" id="tab-shortcuts" aria-controls="panel-shortcuts" aria-selected="false" tabindex="-1" data-i18n="desktop.shortcuts"></button>
      <button type="button" role="tab" id="tab-about" aria-controls="panel-about" aria-selected="false" tabindex="-1" data-i18n="desktop.about"></button>
    </div>
  </header>

  <main class="window-content" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings">
    <section class="section" aria-labelledby="h-general">
      <h2 class="section-title" id="h-general" data-i18n="desktop.general"></h2>
      <div class="list">
        <label class="row">
          <span class="row-text">
            <span class="row-title" id="label-close-to-tray" data-i18n="desktop.closeToTray"></span>
            <span class="row-subtitle" id="hint-close-to-tray" data-i18n="desktop.closeToTrayHint"></span>
          </span>
          <input type="checkbox" role="switch" class="switch" data-setting="closeToTray" aria-labelledby="label-close-to-tray" aria-describedby="hint-close-to-tray">
        </label>
        <label class="row">
          <span class="row-text"><span class="row-title" data-i18n="desktop.checkForUpdates"></span></span>
          <input type="checkbox" role="switch" class="switch" data-setting="checkUpdates">
        </label>
        <label class="row">
          <span class="row-text"><span class="row-title" data-i18n="desktop.language"></span></span>
          <select class="select" id="language"></select>
        </label>
      </div>
    </section>

    <section class="section" aria-labelledby="h-notifications">
      <h2 class="section-title" id="h-notifications" data-i18n="desktop.notifications"></h2>
      <div class="list">
        <label class="row">
          <span class="row-text"><span class="row-title" data-i18n="desktop.notifyYourTurn"></span></span>
          <input type="checkbox" role="switch" class="switch" data-setting="notifyYourTurn">
        </label>
        <label class="row">
          <span class="row-text"><span class="row-title" data-i18n="desktop.notifyGameOver"></span></span>
          <input type="checkbox" role="switch" class="switch" data-setting="notifyGameOver">
        </label>
        <label class="row">
          <span class="row-text">
            <span class="row-title" id="label-attention" data-i18n="desktop.attention"></span>
            <span class="row-subtitle" id="hint-attention" data-i18n="desktop.attentionHint"></span>
          </span>
          <input type="checkbox" role="switch" class="switch" data-setting="attention" aria-labelledby="label-attention" aria-describedby="hint-attention">
        </label>
      </div>
    </section>
  </main>

  <main class="window-content" id="panel-shortcuts" role="tabpanel" aria-labelledby="tab-shortcuts" tabindex="0" hidden>
    <section class="section">
      <div class="list" id="shortcut-list"></div>
    </section>
  </main>

  <main class="window-content" id="panel-about" role="tabpanel" aria-labelledby="tab-about" hidden>
    <section class="section">
      <div class="list">
        <div class="row">
          <span class="row-text">
            <span class="row-title">Lichess Desktop</span>
            <span class="row-subtitle" data-i18n="desktop.unofficial"></span>
          </span>
          <span class="row-value selectable" id="version"></span>
        </div>
        <div class="row" id="update-status" role="status">
          <span class="row-text"><span class="row-title" id="update-status-text"></span></span>
        </div>
        <a class="row" id="link-update" hidden>
          <span class="row-text"><span class="row-title" id="update-available"></span></span>
          <span class="row-value">GitHub</span>
          <span class="row-icon external" aria-hidden="true"></span>
        </a>
        <a class="row" id="link-source">
          <span class="row-text"><span class="row-title" data-i18n="desktop.sourceCode"></span></span>
          <span class="row-value">GitHub</span>
          <span class="row-icon external" aria-hidden="true"></span>
        </a>
        <a class="row" id="link-license">
          <span class="row-text"><span class="row-title" data-i18n="desktop.license"></span></span>
          <span class="row-value">AGPL-3.0-or-later</span>
          <span class="row-icon external" aria-hidden="true"></span>
        </a>
        <a class="row" href="https://lichess.org/">
          <span class="row-text"><span class="row-title">lichess.org</span></span>
          <span class="row-icon external" aria-hidden="true"></span>
        </a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
