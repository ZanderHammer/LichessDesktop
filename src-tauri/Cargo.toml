[package]
name = "lichess-desktop"
version = "0.1.0"
description = "Unofficial lightweight desktop app for lichess.org"
authors = ["Alexander Hammer"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ZanderHammer/LichessDesktop"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
