[package]
name = "lichess-desktop"
version = "0.1.0"
description = "Unofficial lightweight desktop app for lichess.org"
authors = ["Alexander Hammer"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ZanderHammer/LichessDesktop"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = "1"
serde_json = "1"
sys-locale = "0.3.2"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2.5.0"
tauri-plugin-window-state = "2"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Selects tray-icon's ksni (pure D-Bus StatusNotifierItem) backend over libappindicator
# through feature unification: it reports left clicks and doesn't load libayatana.
# Must stay on the tray-icon version tauri uses (ADR 0014).
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
