[package]
name = "lichess-desktop"
version = "0.3.0"
description = "Unofficial lightweight desktop app for lichess.org"
authors = ["Alexander Hammer"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ZanderHammer/LichessDesktop"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.3.4", features = ["std"] }
keyring-core = "1.0.1"
semver = "1.0.28"
serde = "1"
serde_json = "1"
sha2 = { version = "0.10.9", default-features = false }
sys-locale = "0.3.2"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2"
tauri-plugin-store = "2.5.0"
tauri-plugin-window-state = "2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Selects tray-icon's ksni (pure D-Bus StatusNotifierItem) backend over libappindicator
# through feature unification: it reports left clicks and doesn't load libayatana.
# Must stay on the tray-icon version tauri uses (ADR 0014).
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
# The GTK window and WebKitGTK webview for the shortcuts and mouse back/forward
# (ADR 0010). Must stay on the versions tauri uses.
gtk = "0.18.2"
webkit2gtk = "2.0.2"
# The token store (ADR 0024). Reuses the zbus that the tray already brings in.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

# WebView2's AcceleratorKeyPressed event for the shortcuts, history calls and
# the clipboard (ADR 0010). Must stay on the versions tauri uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
# The token store (ADR 0024).
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows = { version = "0.62.2", features = [
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
] }

# WKWebView history calls and the pasteboard for the navigation actions.
# Must stay on the versions wry uses.
[target.'cfg(target_os = "macos")'.dependencies]
# The token store (ADR 0024).
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSPasteboard",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSString",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "WKNavigation",
  "WKWebView",
] }
