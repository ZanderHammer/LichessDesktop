# git-cliff configuration: release notes for GitHub Releases (there is no CHANGELOG file).
# Based on https://github.com/orhun/git-cliff/blob/main/config/cliff.toml
# Docs: https://git-cliff.org/docs/configuration
# Decisions: docs/adr/0003-trunk-based-development-and-tag-releases.md, docs/adr/0004-conventional-commits-and-semver.md

[changelog]
# The release title already holds the version, so the body only lists grouped commits.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ZanderHammer/LichessDesktop/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },
    { message = "^doc", group = "<!-- 4 -->Documentation" },
    { message = "^style", group = "<!-- 5 -->Styling" },
    { message = "^test", group = "<!-- 6 -->Testing" },
    { body = ".*security", group = "<!-- 7 -->Security" },
    { message = "^revert", group = "<!-- 8 -->Revert" },
    { message = "^(chore|ci|build)", group = "<!-- 9 -->Miscellaneous" },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"

[bump]
# While in 0.x, breaking changes bump minor (SemVer §4); features bump minor.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
