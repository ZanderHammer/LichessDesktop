name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        uses: crate-ci/committed@v1.1.11
        with:
          commits: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: Lint pushed commits
        # A zero "before" SHA means a new branch; there is no range to check.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: crate-ci/committed@v1.1.11
        with:
          commits: ${{ github.event.before }}..${{ github.sha }}
      - name: Reject AI attribution
        # Commits and PRs carry no AI/LLM attribution (CLAUDE.md).
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          pattern='^[[:space:]]*(co-authored-by:|(🤖[[:space:]]*)?generated (with|by) )'
          bad=0
          for sha in $(git rev-list "$RANGE"); do
            if git log -1 --format=%B "$sha" | grep -qiE "$pattern"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") contains an AI attribution line:"
              git log -1 --format=%B "$sha" | grep -iE "$pattern"
              bad=1
            fi
          done
          exit "$bad"

  check:
    name: Check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
